name: README board render preview

on:
  push:
    branches:
      - readme-board-render-preview
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Populate C2 and J7 for preview only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pedalboard-hw.kicad_pcb")
          s = p.read_text()

          def find_footprint(text, ref):
              pos = 0
              while True:
                  i = text.find("(footprint", pos)
                  if i < 0:
                      raise RuntimeError(f"{ref} not found")
                  depth = 0
                  in_str = False
                  esc = False
                  j = i
                  while j < len(text):
                      ch = text[j]
                      if in_str:
                          if esc:
                              esc = False
                          elif ch == "\\":
                              esc = True
                          elif ch == '"':
                              in_str = False
                      else:
                          if ch == '"':
                              in_str = True
                          elif ch == "(":
                              depth += 1
                          elif ch == ")":
                              depth -= 1
                              if depth == 0:
                                  j += 1
                                  break
                      j += 1
                  block = text[i:j]
                  if f'(property "Reference" "{ref}"' in block:
                      return i, j, block
                  pos = j

          for ref in ("C2", "J7"):
              i, j, block = find_footprint(s, ref)
              original = block
              block = block.replace("(attr through_hole dnp)", "(attr through_hole)")
              block = block.replace("(attr smd dnp)", "(attr smd)")
              if block == original:
                  raise RuntimeError(f"{ref}: DNP attribute not found")
              s = s[:i] + block + s[j:]
              print(f"{ref}: temporarily changed from DNP to populated")

          p.write_text(s)
          PY

      - name: Render KiCad 3D preview
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: readme-render.kibot.yaml
          board: pedalboard-hw.kicad_pcb
          schema: pedalboard-hw.kicad_sch
          dir: render-output
          targets: readme_render
          skip: all
          install3D: YES
          cache3D: YES
          verbose: 2

      - name: Upload render preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-board-render-preview
          path: render-output/
          if-no-files-found: warn
