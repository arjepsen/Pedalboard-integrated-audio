name: Build Raw Project ZIP
on:
  push:
    branches:
      - quilter-raw-export-temp-20260923
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make raw project ZIP
        shell: bash
        run: |
          rm -rf .git .github
          zip -r Pedalboard-integrated-audio-raw.zip . \
            -x "*.kicad_prl" "*.kicad_sch-bak" "*.kicad_pcb-bak" \
               "Pedalboard-integrated-audio-raw.zip"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pedalboard-integrated-audio-raw
          path: Pedalboard-integrated-audio-raw.zip
